const SERVICES = [{"id": "ftp", "name": "FTP", "full": "File Transfer Protocol", "port": "21 / tcp", "desc": "The classic file transfer service. Pentesters care because anonymous logins, misconfigured permissions, and files left lying around make it a frequent first foothold.", "questions": ["Can I log in as anonymous?", "What version runs — any public CVEs for it?", "Can I upload files (write access)? → webshell potential", "What sensitive files are here? (configs, keys, backups)", "Does ls hang? → firewall behavior → try passive mode", "Is the banner customized? (org name, internal naming leaks)", "Are credentials reused? (ftp creds → try ssh/smb/web with them)"], "tables": [{"title": "Fingerprint", "rows": [["nmap -sV -p21 <TARGET_IP>", "fingerprint the FTP server + version"], ["sudo nmap -p21 -sV --disable-arp-ping -n --packet-trace <TARGET_IP>", "verbose lab scan — --disable-arp-ping for VPN targets, -n skips DNS, --packet-trace can expose the banner directly"], ["nc -nv <TARGET_IP> 21", "grab the banner without credentials (interactive)"], ["ftp <TARGET_IP>", "start a session — the 220 greeting line reveals the version"]]}, {"title": "Access & Transfer", "rows": [["anonymous", "login username for anonymous access (password: anything)"], ["ls", "list files in the current directory"], ["cd dir", "change directory"], ["get file.txt", "download a single file"], ["mget *.txt", "download multiple files (use prompt first)"], ["put file.txt", "upload a file (needs write permission)"], ["binary", "binary transfer mode — for exe/zip/images"], ["ascii", "text transfer mode — for text files"], ["passive", "toggle passive mode — fixes hanging directory listings"], ["status", "show current settings (passive on/off, transfer type)"], ["quit or bye", "exit the session"]]}], "notes": ["Passive mode: FTP uses two channels — control (21) and a temporary data channel. In active mode the server connects back to the client (blocked by NAT/firewalls); in passive mode the client connects to a server-opened port. If login works but ls hangs — type passive.", "Code 220: the first line any FTP server sends is its greeting (220 ...) — even a plain connection reveals the version.", "binary is a safe habit, not always required: modern clients auto-negotiate binary when the server reports a UNIX system type (watch for 'Using binary mode to transfer files'). ASCII mode corrupts executables, zips and SSH keys — when in doubt, type binary."], "walkthrough": [{"n": "🏴 I found port 21 open — what can an FTP server give me?"}, {"q": "what version is this server? any known CVE?", "c": "nc -nv 10.10.10.10 21", "r": "(UNKNOWN) [10.10.10.10] 21 (ftp) open\n220 ProFreight FTP v1.1", "tools": ["nc", "nmap"]}, {"q": "can I check anonymous access automatically?", "c": "nmap --script=ftp-anon -p21 10.10.10.10", "r": "21/tcp open  ftp\n| ftp-anon: Anonymous FTP login allowed (FTP code 230)\n|_-rw-r--r--   1 ftp   ftp     38  flag.txt", "tools": ["ftp-anon"]}, {"q": "let me log in as anonymous", "c": "ftp 10.10.10.10", "r": "Connected to 10.10.10.10.\n220 ProFreight FTP v1.1\nName (10.10.10.10:root): anonymous\n331 Anonymous login ok, send your complete email address as your password\nPassword: anything\n230 Anonymous access granted, restrictions apply\nUsing binary mode to transfer files.\nftp>", "tools": ["ftp"]}, {"q": "what files are here? (if ls hangs → passive)", "c": "ftp> passive\nftp> ls", "r": "-rw-r--r--  1 ftp  ftp     38  flag.txt\n-rw-r--r--  1 ftp  ftp  2.1K  backup.zip\ndrwxr-xr-x  2 ftp  ftp  4096  .hidden"}, {"q": "download the interesting stuff", "c": "ftp> binary\nftp> get flag.txt\nftp> prompt\nftp> mget *.zip", "r": "226 Transfer complete"}, {"q": "can I upload?", "c": "ftp> put test.txt", "r": "550 Permission denied   ← ❌ read-only\n(or: 226 Transfer complete  ← ✅ writable!)"}, {"q": "done — do these creds work elsewhere?", "c": "ftp> bye\nhydra -l robin -P pass.txt 10.10.10.10 ssh", "r": "[22][ssh] host: 10.10.10.10  login: robin  password: summer2021", "tools": ["hydra"]}]}, {"id": "smb", "name": "SMB", "full": "Server Message Block", "port": "139, 445 / tcp", "desc": "Windows-native file and printer sharing (Samba on Linux). Null sessions, readable shares, and version-specific CVEs (like MS17-010) make it one of the richest enumeration targets.", "questions": ["What SMB version/dialect? (SMB1 → check EternalBlue)", "Any known CVE for this version?", "Can I list shares with a null session?", "What is readable inside shares?", "Any writable share (upload/webshell potential)?", "Can RPC null session enumerate users?", "Is message signing enforced (relay attacks)?", "Samba or Windows — which exact version?"], "tables": [{"title": "Phase 1 — Fingerprint", "rows": [["nmap -sV -p139,445 <TARGET_IP>", "fingerprint SMB service + exact version (needed for CVE lookup)"], ["nmap --script=smb-os-discovery -p445 <TARGET_IP>", "OS name, domain, SMB dialect version"], ["nmap --script=\"smb-vuln-*\" -p445 <TARGET_IP>", "test for known SMB CVEs (e.g. MS17-010)"]]}, {"title": "Phase 2 — Enumerate shares (null session)", "rows": [["smbmap -H <TARGET_IP>", "quick map of all shares + your access level (READ/WRITE) on each"], ["smbclient -N -L <TARGET_IP>", "list all shares anonymously (-N = no password, -L = list)"], ["enum4linux-ng <TARGET_IP> -A", "full automated enumeration: shares, users, groups, OS, password policy"], ["nmap --script=\"smb-enum-*\" -p445 <TARGET_IP>", "every SMB enumeration script via NSE"]]}, {"title": "Phase 3 — Access & loot", "rows": [["smbclient //<TARGET_IP>/SHARE -N", "connect to a share (interactive smb: \\> prompt)"], ["ls", "list files in the share"], ["cd dir", "move between directories"], ["get file.txt", "download a file"], ["put file.txt", "upload a file (WRITE-access shares only)"], ["recurse", "enable recursive mode"], ["prompt", "toggle confirmations off (for mass download)"], ["mget *", "download everything in current directory"], ["!command", "run a shell command without leaving smbclient (e.g. !cat flag.txt)"], ["quit", "exit smbclient"]]}, {"title": "Phase 4 — Deep enumeration via RPC (null session)", "rows": [["rpcclient -U \"\" <TARGET_IP>", "null session over RPC (empty user, Enter at password → rpcclient $>)"], ["querydominfo", "inside rpcclient — domain name, server name, server role (PDC/BDC)"], ["netsharegetinfo SHARE", "inside rpcclient — share remark, real disk path, permissions"]]}], "notes": ["139 vs 445: 139 = SMB over legacy NetBIOS; 445 = modern SMB over TCP (your main target).", "SMB versions: SMB1 (CIFS — old, EternalBlue-era), SMB2, SMB3 — the same tools work on all; the version matters for CVE matching.", "WRITE access = attack surface: writable shares allow upload (webshells, loot storage).", "Samba quirk: Linux Samba servers display share paths Windows-style (C:\\home\\user\\) — the real path is /home/user.", "Shares = SMB's 'doors'. smbclient -L asks 'how many doors exist?', smbmap answers 'which doors are open FOR ME'."], "walkthrough": [{"n": "🏴 I found port 445 open — no credentials. What can I see?"}, {"q": "what shares can I check with no credentials?", "c": "smbmap -H 10.10.10.10", "r": "[+] 10.10.10.10:445\n    Disk     Permissions    Comment\n    ----     -----------    -------\n    print$   NO ACCESS      Printer Drivers\n    share    READ           ← 🎯\n    IPC$     NO ACCESS", "tools": ["smbmap"]}, {"q": "let me list all share names properly", "c": "smbclient -N -L 10.10.10.10", "r": "Sharename   Type   Comment\n---------   ----   -------\nshare       Disk   Shared files\nSMB1 disabled -- no workgroup available", "tools": ["smbclient"]}, {"q": "that share is readable — what's inside?", "c": "smbclient //10.10.10.10/share -N", "r": "smb: \\> ls\n  flag.txt     N    38\n  notes.txt    N  1.2K\nsmb: \\> get flag.txt\nsmb: \\> !cat flag.txt", "tools": ["smbclient"]}, {"q": "more details — users, groups, OS...", "c": "enum4linux-ng 10.10.10.10 -A", "r": "[=] Target information ... OS: Windows 10\n[=] Users: administrator, guest, backupadmin", "tools": ["enum4linux-ng"]}, {"q": "even MORE — domain + users via RPC", "c": "rpcclient -U \"\" 10.10.10.10", "r": "rpcclient $> querydominfo\nDomain:  DEVOPS\nServer:  DEVSMB\n\nrpcclient $> enumdomusers\nuser:[backupadmin] rid:[0x3f2]", "tools": ["rpcclient"]}], "tools": [{"name": "smbmap", "tag": "which shares can I open?", "flags": [["-H", "target IP (practically required)"], ["-u / -p / -d", "username / password / domain"], ["-P", "port (capital P — not the password!)"], ["-s", "test a specific share"], ["-r <path>", "recursive listing of a path"], ["-R", "recursive listing of ALL readable shares"], ["-A <pattern>", "filter file names during -R (e.g. flag*)"], ["-g <word>", "grep inside file contents during -R 🔥"], ["-x <cmd>", "attempt command execution on writable share"], ["--download / --upload", "pull / push files"], ["-L", "list drives"]]}, {"name": "smbclient", "tag": "the FTP-style client", "flags": [["-L", "list share names (discovery mode)"], ["-N", "null session (no password)"], ["-U user  or  -U user%pass", "authenticate (prompts if no %pass)"], ["-p", "port (here lowercase -p IS the port — opposite of smbmap!)"], ["-c \"cmd1;cmd2\"", "run commands non-interactively (scripting)"], ["-W", "workgroup"], ["in-session: ls, cd, get, put, mget, recurse, prompt, !cmd, quit", "file operations"]]}, {"name": "enum4linux-ng", "tag": "the full report", "flags": [["-A", "everything: shares, users, groups, OS, password policy"], ["-u / -p / -d", "credentials / domain"], ["-s", "shares only"], ["-y", "users only"], ["-g", "groups only"], ["-o", "OS info only"], ["-r", "RID cycling (enumerate users by RID numbers)"], ["-R <range>", "custom RID range (e.g. 500-550)"], ["-n", "include nmblookup (NetBIOS names)"], ["-w", "workgroup"], ["-k", "Kerberos authentication"], ["-v", "verbose"]]}, {"name": "rpcclient", "tag": "the hidden details", "flags": [["-U \"\"", "null session (the classic)"], ["-U user%pass", "authenticated session"], ["-c \"cmd\"", "run one command and exit (scripting)"], ["-N", "no password prompt"], ["-I", "connect to a different IP than the name"], ["querydominfo", "domain, server name, role (PDC/BDC)"], ["enumdomusers", "list domain users 🔥"], ["enumdomgroups", "list groups"], ["queryuser <rid>", "details on a specific user"], ["netshareenum", "list shares"], ["netsharegetinfo <share>", "share details: path, remark, perms"], ["getdompwinfo", "password policy (length, lockout)"], ["lookupsids <SID>", "translate SID → username"], ["srvinfo", "server info"], ["createdomuser <name>", "create user (needs admin!)"], ["quit", "exit"]]}]}, {"id": "nfs", "name": "NFS", "full": "Network File System", "port": "2049 / tcp", "desc": "Unix-style remote file mounts by Sun (1984). Weakly restricted exports let you mount entire directories into your own filesystem and hunt for leaked credentials and keys.", "questions": ["What is exported and to which subnets?", "Can I mount it as root (root squashing on or off)?", "Any credentials or SSH keys in the files?", "What other RPC services are registered?"], "tables": [{"title": "Command | Purpose", "rows": [["showmount -e <TARGET_IP>", "list exported shares + who can access them"], ["mkdir NFS && sudo mount -t nfs <TARGET_IP>:/share ./NFS/", "create mount point and mount the share"], ["ls -lA NFS/", "inspect files (check sizes — non-zero = has content)"], ["cat NFS/file.txt", "read files directly"], ["rpcinfo -p <TARGET_IP>", "list RPC services (nfs, mountd, nlockmgr...)"], ["sudo umount ./NFS", "unmount when done"], ["nmap -sV --script=\"nfs-*\" -p111,2049 <TARGET_IP>", "full NFS enumeration via NSE"]]}], "notes": ["Mounting requires root (sudo). Exports restricted to specific subnets (e.g. 10.0.0.0/8) only accept mounts from that range — you may need to pivot.", "Mounting glues the remote directory into YOUR filesystem — after that every normal bash tool works on it (ls, cat, grep, cp).", "Default root squashing maps remote root to nobody — read still works, write usually doesn't (misconfigured servers = gold).", "Ticket-style files in shares are a classic credential-leak source — read every non-empty file.","The mount point stays a plain empty local directory \u2014 mount only COVERS it: while mounted you see the target\u2019s files, after umount your own (empty) folder is visible again. Anything you write while mounted goes to the TARGET, not to your disk."], "walkthrough": [{"n": "🏴 I found port 2049 open — you mount NFS, you don't log in."}, {"q": "what directories is it exporting?", "c": "showmount -e 10.10.10.10", "r": "Export list for 10.10.10.10:\n/var/nfs       10.0.0.0/8\n/mnt/nfsshare  10.0.0.0/8", "tools": ["showmount"]}, {"q": "mount it locally", "c": "mkdir target && sudo mount -t nfs 10.10.10.10:/var/nfs ./target", "r": "mount.nfs: trying text-based options 'vers=4.2,addr=10.10.10.10'", "tools": ["mount"]}, {"q": "now it's a local disk — check file sizes", "c": "ls -lA target/", "r": "-rw-r--r--  1 nobody  4294967294     0  empty.txt\n-rw-r--r--  1 nobody  4294967294  1.3K  ticket4238.txt  ← non-zero = read it"}, {"q": "grab what matters", "c": "cat target/ticket4238.txt", "r": "Conversation with InlaneFreight Ltd ...\nuser=alex password=lol123!mD   ← 🎯 credentials!"}, {"q": "clean up when done", "c": "sudo umount ./target"}]}, {"id": "dns", "name": "DNS", "full": "Domain Name System", "port": "53 / tcp+udp", "desc": "Translates names to IPs. Zone transfers (AXFR) can dump a full network map; TXT records leak infrastructure details.", "questions": ["Can I perform a zone transfer (AXFR)?", "What subdomains exist — any internal ones?", "What do TXT records leak?", "Can I bruteforce more subdomains?", "Is it an open resolver?"], "tables": [{"title": "Command | Purpose", "rows": [["dig <DOMAIN> @<TARGET_IP>", "basic A record query against the target server"], ["dig ANY <DOMAIN> @<TARGET_IP>", "dump ALL records (TXT, SOA, NS, A...)"], ["dig MX <DOMAIN> @<TARGET_IP> / dig NS <DOMAIN> @<TARGET_IP>", "mail servers / name servers"], ["dig -x <TARGET_IP> @<TARGET_IP>", "reverse lookup"], ["host <DOMAIN> <TARGET_IP>", "quick alternative to dig"], ["dig AXFR <DOMAIN> @<TARGET_IP>", "zone transfer — dumps the entire zone if misconfigured 🔥"], ["dig AXFR <SUB>.<DOMAIN> @<TARGET_IP>", "zone transfer on a subdomain (different data!)"], ["dnsenum --dnsserver <TARGET_IP> --enum -p 0 -s 0 -f wordlist.txt <DOMAIN>", "bruteforce subdomains"], ["sudo sh -c 'echo \"<TARGET_IP> hostname\" >> /etc/hosts'", "map internal hostnames locally"]]}], "notes": ["A successful AXFR is gold: full host list, internal IPs, and sometimes flags hidden in TXT records. Always try AXFR on every subdomain you discover.", "TXT records often leak SPF configuration (mail infrastructure), verification tokens, and internal naming conventions."], "walkthrough": [{"n": "🏴 I found port 53 open — DNS servers know the network's secrets."}, {"q": "dump everything this server knows", "c": "dig ANY example.org @10.10.10.10", "r": ";; ANSWER SECTION:\nexample.org.  604800  IN  TXT  \"v=spf1 include:mail.example.org ~all\"\nexample.org.  604800  IN  SOA  ns.example.org. root.example.org.", "tools": ["dig"]}, {"q": "can I pull the whole zone?", "c": "dig AXFR example.org @10.10.10.10", "r": "app.example.org.       604800  IN  A  10.10.10.15\ninternal.example.org.  604800  IN  A  10.10.10.6   ← 🎯\n;; XFR size: 11 records   ← AXFR succeeded = misconfiguration gold", "tools": ["dig"]}, {"q": "found an internal subdomain — bruteforce deeper", "c": "dnsenum --dnsserver 10.10.10.10 --enum -p 0 -s 0 -f namelist.txt internal.example.org", "r": "Brute forcing with namelist.txt:\nvpn.internal.example.org.   604800  IN  A  10.10.10.6", "tools": ["dnsenum"]}]}, {"id": "smtp", "name": "SMTP", "full": "Simple Mail Transfer Protocol", "port": "25 / tcp", "desc": "Sends mail and validates users. User enumeration (VRFY/RCPT) builds username lists that feed every other brute-force attack.", "questions": ["What version — any CVEs?", "Can I enumerate valid users (VRFY/RCPT/EXPN)?", "Is it an open relay?", "Does the banner leak internal naming?"], "tables": [{"title": "Command | Purpose", "rows": [["telnet <TARGET_IP> 25", "connect + grab banner (220 ...)"], ["nc <TARGET_IP> 25  →  VRFY root / EXPN admin", "manual user validation (EXPN expands mailing lists)"], ["RCPT trick", "MAIL FROM:x then RCPT TO:<user> — 'User unknown' vs 250 reply reveals validity"], ["smtp-user-enum -M VRFY -U wordlist.txt -t <TARGET_IP> -w 20", "bruteforce valid usernames"], ["nmap --script=\"smtp-*\" -p25 <TARGET_IP>", "enum-users, commands, open-relay checks"]]}], "notes": ["Usernames harvested here feed directly into brute-force attacks (ssh, smb, web logins) — save every valid user.", "A 250 reply to an unauthenticated RCPT confirms both the user and an open relay configuration."], "walkthrough": [{"n": "🏴 I found port 25 open — mail servers know every username in the company."}, {"q": "grab the banner", "c": "telnet 10.10.10.10 25", "r": "Connected to 10.10.10.10.\n220 mail.example.org ESMTP Postfix", "tools": ["telnet"]}, {"q": "enumerate valid users", "c": "smtp-user-enum -M VRFY -U users.txt -t 10.10.10.10 -w 20", "r": "10.10.10.10: robin exists\n10.10.10.10: backup exists", "tools": ["smtp-user-enum"]}, {"q": "manual check for one user", "c": "nc 10.10.10.10 25\nVRFY admin", "r": "220 mail.example.org ESMTP\n252 2.0.0 admin     ← exists!  (550 = not found)", "tools": ["nc"]}]}, {"id": "imap-pop3", "name": "IMAP / POP3", "full": "Internet Message Access Protocol / Post Office Protocol", "port": "110, 143, 993, 995 / tcp", "desc": "Mail retrieval protocols. Inboxes are a goldmine: credentials, private keys, and configs sent by email.", "questions": ["What do the SSL certs leak (org, FQDN)?", "Can I log in with found or default credentials?", "Do any emails contain credentials or private keys?", "Cleartext or encrypted only?"], "tables": [{"title": "Command | Purpose", "rows": [["nmap -p110,143,993,995 -sC -sV <TARGET_IP>", "scan all 4 ports — SSL cert leaks org name + FQDN"], ["openssl s_client -connect <TARGET_IP>:imaps", "connect to 993 (IMAPS) — banner can hide flags"], ["openssl s_client -connect <TARGET_IP>:pop3s", "connect to 995 (POP3S)"], ["openssl s_client -starttls imap -connect <TARGET_IP>:143", "STARTTLS on plain IMAP"], ["telnet <TARGET_IP> 110", "POP3 banner (+OK ...)"], ["tag0 LOGIN user pass", "authenticate inside IMAP"], ["tag1 LIST \"\" \"*\"", "list all mailboxes/folders"], ["tag2 SELECT \"MAILBOX\"", "open a mailbox"], ["tag3 FETCH 1 (BODY[])", "read full email #1"], ["USER x → PASS x → LIST → RETR 1", "POP3 manual email reading flow"]]}], "notes": ["The IMAP tag can be any string (tag0, a1, 1337...) — it's just a label so you can match replies to commands.", "Emails are a top-tier loot source: credentials, SSH private keys, and config snippets appear constantly."], "walkthrough": [{"n": "🏴 Ports 110/143/993/995 open — someone mailbox is a treasure chest."}, {"q": "what do the certs and versions leak?", "c": "nmap -p110,143,993,995 -sC -sV 10.10.10.10", "r": "ssl-cert: commonName=dev.example.org / organizationName=Example Ltd", "tools": ["nmap"]}, {"q": "connect to IMAPS", "c": "openssl s_client -connect 10.10.10.10:imaps", "r": "* OK [CAPABILITY IMAP4rev1 ...] Dovecot ready.", "tools": ["openssl"]}, {"q": "log in and read mail", "c": "tag0 LOGIN robin robin", "r": "tag0 OK [...] Logged in", "tools": ["imap-commands"]}, {"q": "find the interesting mailbox", "c": "tag1 LIST \"\" \"*\"", "r": "* LIST (...) \".\" INBOX\n* LIST (...) \".\" DEV.DEPARTMENT.INT   ← 🎯", "tools": ["imap-commands"]}, {"q": "open it and read", "c": "tag2 SELECT \"DEV.DEPARTMENT.INT\"\ntag3 FETCH 1 (BODY[])", "r": "* 1 FETCH (BODY[] {167}\nFrom: CTO <admin@example.org>\nFLAG{example_email_flag}", "tools": ["imap-commands"]}]}, {"id": "snmp", "name": "SNMP", "full": "Simple Network Management Protocol", "port": "161 / udp", "desc": "Device monitoring protocol. Default community strings function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hi(src){
  const tokens = src.match(/("[^"]*"|'[^']*'|<[^>]+>|-{1,2}[\w?][\w?=:\/-]*|\d+\.\d+\.\d+\.\d+|\S+)/g) || [];
  let progIdx = 0;
  if(/(>\$?|^[\$>]|→)/.test(tokens[0]||'')) progIdx = 1;
  return tokens.map((t,i)=>{
    const e = esc(t);
    let cls='';
    if(i===progIdx && !t.startsWith('-') && !/^["'<$]/.test(t)) cls='tk-p';
    else if(/^-{1,2}/.test(t)) cls='tk-f';
    else if(/^["']/.test(t)) cls='tk-s';
    else if(/^<|^\d+\.\d+\.\d+\.\d+$/.test(t)) cls='tk-v';
    return '<span class="'+cls+'">'+e+'</span>';
  }).join(' ');
}
function toolCardHtml(name){
  const t = TOOLS[name]; if(!t) return '';
  let h = '<div class="tool-card" data-card="'+esc(name)+'"><div class="tool-card-head"><div class="tool-card-name">'+esc(name)+'</div><div class="tool-card-desc">'+esc(t[1])+'</div></div><table>';
  t[2].forEach(f=>{ h+='<tr><td class="f">'+esc(f[0])+'</td><td>'+esc(f[1])+'</td></tr>'; });
  return h+'</table></div>';
}
function wtHtml(steps){
  let h='<div class="wt"><div class="wt-title">Walkthrough — think, then type</div>';
  steps.forEach((s,i)=>{
    if(s.n) h+='<div class="wt-n">'+esc(s.n)+'</div>';
    if(s.q) h+='<div class="wt-q">'+esc(s.q)+'</div>';
    if(s.c) h+='<div class="wt-c">'+s.c.split('\n').map(l=>(l.includes('>')||l.startsWith('tag')||l.startsWith('msf6'))?esc(l):hi(l)).join('\n')+'</div>';
    if(s.r) h+='<div class="wt-o">'+esc(s.r)+'</div>';
    if(s.tools) h+='<div class="wt-tools">'+s.tools.map(tn=>'<button class="tool-chip" data-tool="'+esc(tn)+'" data-step="'+i+'">📖 '+esc(tn)+'</button>').join('')+'</div><div class="card-slot" data-slot="'+i+'" style="display:none"></div>';
  });
  return h+'</div>';
}
function renderServices(){

    if(s.walkthrough) h+=wtHtml(s.walkthrough);
    s.tables.forEach(tb=>{
      h+='<div class="svc-table-title">'+esc(tb.title)+'</div><table class="svc"><tr><th style="width:45%">Command</th><th>Purpose</th></tr>';

function showTab(id){
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  const page=document.getElementById('page-'+id); if(page) page.classList.add('active');

  window.scrollTo({top:0});

  localStorage.setItem('bt-theme',t);
  document.getElementById('themeBtn').textContent = t==='dark' ? '☀️ light' : '🌙 dark';
}
setTheme(localStorage.getItem('bt-theme') || 'dark');
document.getElementById('themeBtn').onclick=()=>{ setTheme(document.body.dataset.theme==='dark' ? 'light' : 'dark'); };

  { name:'Full sweep', set:['-PE','-PP','-PS443','-PA80','-sS','-p-','--min-rate','-sV','-sC','-T4','-v','-oA'], vals:{'--min-rate':'10000','-oA':'full'} },
  { name:'Ghost mode', set:['-Pn','-sS','-T1','-f','-D','--source-port'], vals:{'-D':'RND:10','--source-port':'53'} },
  { name:'UDP hunter', set:['-PE','-PP','-PS443','-PA80','-sU','--top-ports','-sV','-T4','-v'], vals:{'--top-ports':'100'} },
];

const state = { sel:new Set(), vals:{}, root:true, target:'', adv:{}, focus:null };
FLAGS.forEach(f => { if (f.def) state.sel.add(f.flag); });

const catsEl = document.getElementById('cats');
const cmdbar = document.getElementById('cmdbar');
const cmdOut = document.getElementById('cmdOut');
const backBtn = document.getElementById('backBtn');

function activeFlags(cat){
  return FLAGS.filter(f => f.cat===cat && state.sel.has(f.flag) && !(f.root && !state.root));
}

function flagRow(f, dis){
  if (f.adv && !state.adv[f.cat]) return '';
  const deepHtml = f.deep ? `<div class="deep-box" data-deepbox="${f.flag}" style="display:none">${f.deep}${f.cancels?`<div class="cancels"><b>cancels/overrides:</b> ${f.cancels}</div>`:''}</div>` : '';
  return `<div class="flag-row ${dis?'disabled':''} ${f.adv?'adv':''}">
    <input type="checkbox" data-f="${f.flag}" ${state.sel.has(f.flag)&&!dis?'checked':''} ${dis?'disabled':''}>
    <div class="flag-main">
      <div class="flag-top">
        <span class="flag-name">${f.flag}</span>
        <span class="flag-label">${f.label||''}</span>
        ${f.root?'<span class="tag tag-root">root</span>':''}
        ${f.adv?'<span class="tag tag-adv">adv</span>':''}
        ${f.value?`<input class="flag-val" data-v="${f.flag}" placeholder="${f.value}" value="${state.vals[f.flag]||''}">`:''}
      </div>
      <div class="flag-hint">${f.hint}${f.deep?` <button class="q-btn" data-q="${f.flag}" title="deeper explanation">?</button>`:''}</div>
      ${deepHtml}
    </div>
  </div>`;
}

function catDetails(c, forceOpen){
  const det = document.createElement('details');
  det.className = 'cat'; det.open = forceOpen;
  const fl = FLAGS.filter(f => f.cat === c.id);
  const rows = fl.map(f => flagRow(f, f.root && !state.root)).join('');
  const advCount = fl.filter(f => f.adv).length;
  const toggle = advCount ? `<button class="adv-toggle" data-advcat="${c.id}">${state.adv[c.id]?'− hide':'+ show'} advanced (${advCount})</button>` : '';
  det.innerHTML = `<summary>${c.name}<span class="chev">▸</span></summary><div class="cat-body">${rows}${toggle}</div>`;
  return det;
}

function renderCats(){
  catsEl.innerHTML = '';
  if (state.focus) {
    const c = CATS.find(x => x.id === state.focus);
    if (c) catsEl.appendChild(catDetails(c, true));
  } else {
    CATS.forEach(c => catsEl.appendChild(catDetails(c, ['discovery','portscan'].includes(c.id))));
  }
  backBtn.style.display = state.focus ? 'inline-block' : 'none';
}

function renderBar(){
  let h = '<span class="pfx">sudo nmap</span>';
  BOXES.forEach(b => {
    const active = state.focus === b;
    if (b === 'target') {
      h += `<span class="box ${active?'active':''}" data-box="target" title="click to focus on this stage">[<input id="tgtBox" placeholder="TARGET" value="${state.target}">]</span>`;
      return;
    }
    const sel = activeFlags(b);
    const chips = sel.map(f => {
      const v = state.vals[f.flag] || f.value;
      return `<span class="chip">${f.flag}${f.value&&v?' '+v:''}</span>`;
    });
    (INFO_CHIPS[b]||[]).forEach(i => chips.push(`<span class="info" title="${i.d}">${i.t}</span>`));
    const inner = chips.length ? chips.join('') : '<span style="opacity:.5">--</span>';
    h += `<span class="box ${sel.length?'':'empty'} ${active?'active':''}" data-box="${b}" title="click to focus on ${BOX_LABEL[b]}">[${inner}]</span>`;
  });
  h += `<span class="tgt-end">${state.target.trim()||'<TARGET>'}</span>`;
  cmdbar.innerHTML = h;
  const ti = document.getElementById('tgtBox');
  if (ti) ti.addEventListener('input', () => { state.target = ti.value; render(); });
}

function command(){
  const parts = ['<span class="dim">sudo</span>','nmap'];
  CATS.forEach(c => activeFlags(c.id).forEach(f => {
    let t = f.flag;
    const v = state.vals[f.flag] || f.value;
    if (f.value && v) t += ' ' + v;
    parts.push(`<span class="flag-part">${t}</span>`);
  }));
  const tgt = state.target.trim() || '<span class="dim">&lt;TARGET&gt;</span>';
  return parts.join(' ') + ' ' + tgt;
}

function warnings(){
  const w = [];
  const has = f => state.sel.has(f) && !(FLAGS.find(x=>x.flag===f).root && !state.root);
  if (has('-A') && (has('-sV')||has('-sC')||has('-O'))) w.push('-A already includes -sV, -sC and -O — the extra flags are redundant.');
  if (has('-sn') && has('-Pn')) w.push('-sn skips port scanning while -Pn skips discovery — this pair is usually a mistake.');
  if (has('-sU') && has('--min-rate')) w.push('UDP + min-rate can overwhelm targets — expect some inaccuracy.');
  if (has('-oA') && (has('-oN')||has('-oX')||has('-oG'))) w.push('-oA already writes .nmap/.xml/.gnmap — the extra -o flags are redundant.');
  const scan = ['-sS','-sT','-sU','-sN','-sF','-sX','-sA','-sI','-sW','-sM','-sO','-sY','-sZ'];
  if (!scan.some(has) && !has('-sn') && !has('-sL')) w.push('No scan technique selected — nmap defaults to -sS (as root).');
  return w;
}

function render(){
  renderBar();
  renderCats();
  cmdOut.innerHTML = command();
  const active = [];
  CATS.forEach(c => activeFlags(c.id).forEach(f => active.push(f.sum || f.label || f.flag)));
  document.getElementById('sumList').innerHTML = active.map(s => `<li>${s}</li>`).join('') || '<li style="color:var(--text-4)">no flags selected yet</li>';
  document.getElementById('warnOut').innerHTML = warnings().map(x => `<div class="warn">${x}</div>`).join('');
  const selCount = [...state.sel].filter(f => { const x = FLAGS.find(y=>y.flag===f); return !(x.root && !state.root); }).length;
  document.getElementById('footCount').textContent = `Nmap Forge v2.0 — ${FLAGS.length} flags · ${selCount} selected · runs 100% offline in your browser`;
}

cmdbar.addEventListener('click', e => {
  const b = e.target.closest('[data-box]');
  if (!b || e.target.tagName === 'INPUT') return;
  state.focus = state.focus === b.dataset.box ? null : b.dataset.box;
  render();
});
backBtn.onclick = () => { state.focus = null; render(); };

catsEl.addEventListener('change', e => {
  const f = FLAGS.find(x => x.flag === e.target.dataset.f);
  if (!f) return;
  if (e.target.checked) {
    if (f.group) FLAGS.filter(x => x.group === f.group).forEach(x => state.sel.delete(x.flag));
    state.sel.add(f.flag);
  } else state.sel.delete(f.flag);
  render();
});
catsEl.addEventListener('input', e => { if (e.target.dataset.v) { state.vals[e.target.dataset.v] = e.target.value; render(); } });
catsEl.addEventListener('click', e => {
  const c = e.target.dataset.advcat;
  if (c) { state.adv[c] = !state.adv[c]; render(); return; }
  const q = e.target.dataset.q;
  if (q) {
    const box = catsEl.querySelector(`[data-deepbox="${CSS.escape(q)}"]`);
    if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }
});
document.getElementById('isRoot').addEventListener('change', e => { state.root = e.target.checked; render(); });

const presetsEl = document.getElementById('presets');
PRESETS.forEach(p => {
  const b = document.createElement('button');
  b.className = 'preset'; b.textContent = p.name;
  b.onclick = () => { state.sel = new Set(); state.vals = {}; state.focus = null; p.set.forEach(f => state.sel.add(f)); Object.assign(state.vals, p.vals); render(); };
  presetsEl.appendChild(b);
});
document.getElementById('copyBtn').onclick = () => {
  const txt = cmdOut.textContent;
  if (navigator.clipboard) navigator.clipboard.writeText(txt);
  const b = document.getElementById('copyBtn');
  b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy command', 1200);
};

render();

})();
</script>
</body>
</html>
